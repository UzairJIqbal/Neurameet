<!-- Script to toggle password visibility (Vanilla JS for micro-interaction) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            const iconSpan = toggleButton.querySelector('.material-symbols-outlined');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle icon
                if (type === 'text') {
                    iconSpan.textContent = 'visibility_off';
                    iconSpan.setAttribute('data-icon', 'visibility_off');
                } else {
                    iconSpan.textContent = 'visibility';
                    iconSpan.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
