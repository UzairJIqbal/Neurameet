<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NeuraMeet - Luminous AI Redesign</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration for Luminous AI Theme -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            primary: '#7c3aed',
            surface: '#faf8ff',
            'surface-container': '#ebeffc',
            'surface-container-high': '#d6dcf2',
            'on-surface': '#191924',
            'on-surface-variant': '#3f4251',
          },
          borderRadius: {
            'xl': '0.75rem',
            '2xl': '1rem',
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(124, 58, 237, 0.05)',
            'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for specific components if needed -->
<style data-purpose="custom-utilities">
    body {
      background-color: #faf8ff;
      color: #191924;
      font-family: 'Manrope', sans-serif;
    }
    
    .glass-card {
      background: rgba(250, 248, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    
    .dark-preview {
      background: linear-gradient(145deg, #1f212a, #16171d);

    }

<body class="min-h-screen flex flex-col antialiased">
<!-- BEGIN: Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-surface-container-high bg-surface sticky top-0 z-10">
<!-- Logo Area -->
<div class="flex items-center gap-3">

<div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight text-on-surface">NeuraMeet</span>
</div>

<div class="flex items-center gap-4">
<div class="hidden sm:flex flex-col items-end mr-2">
<span class="text-sm font-medium text-on-surface">user@example.com</span>
<a class="text-xs text-primary hover:underline transition-all" href="#">Switch account</a>
</div>
<!-- Avatar -->
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-sm font-semibold text-on-surface-variant cursor-pointer border border-surface-container shadow-sm hover:shadow-md transition-shadow">

<!-- Upgrade Button -->
<button class="px-4 py-2 bg-primary/10 text-primary text-sm font-semibold rounded-xl hover:bg-primary/20 transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:outline-none">

<div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-blue-500/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>

<div class="relative w-full aspect-video rounded-2xl dark-preview overflow-hidden shadow-2xl ring-1 ring-white/10 flex flex-col justify-between">

<span class="text-white text-sm font-medium drop-shadow-md">Uzair javaid</span>
<button class="text-white/80 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</div>
</div>

<div class="flex flex-col items-center lg:items-start w-full max-w-sm text-center lg:text-left">

<button class="w-full sm:w-auto min-w-[200px] px-8 py-4 bg-primary text-white text-lg font-semibold rounded-2xl shadow-lg shadow-primary/20 hover:bg-primary/90 hover:shadow-primary/30 transition-all focus:ring-4 focus:ring-primary/30 focus:outline-none mb-4 transform hover:-translate-y-0.5">

<path clip-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" fill-rule="evenodd"></path>
